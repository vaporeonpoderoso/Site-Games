<!DOCTYPE html>
<html lang="por-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Games Zone</title>
</head>

<style>

       body{
           margin: 0;
           font-family: Arial, sans-serif;
           background-color: rgb(0, 0, 0);
           display: flex;
           align-items: center;
           height: 100vh;
           justify-content: center;
           
       }

       .login{
        background-color: rgb(0, 0, 0);
        width: 350px;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 0 15px rgb(48, 97, 227);
        text-align: center;
       }

       h1{
        color: rgb(48, 97, 227);
       }

       
       p{
        color: rgb(48, 97, 227);
       }

       input{
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: none;
        border-radius: 8px;
        box-sizing: border-box;
       }

       button{
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 8px;
        background-color: rgb(48, 97, 227);
        font-weight: bold;
        cursor: pointer;
       }

       button:hover{
        background-color: aquamarine;
       }

       a{
        color: rgb(48, 97, 227);
       }

</style>

<body>
    
    <div class="login">

         <h1> 🎮GameZone🦔</h1>

         <p>Entre na sua conta</p>

         <form action="home.html">

              <input type="email" placeholder="Digite seu Email"></input>
               
              <input type="password" placeholder="Digite sua Senha"></input>

              <button type="submit"> Entrar </button>


         </form>

         <p>
           <a href="#">Criar Conta</a>
         </p>

    </div>


</body>
</html>
